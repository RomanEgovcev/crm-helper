<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>CRM Helper</h2>

  <div class="section">
    <div class="section-title">Таймер на линии</div>
    <div class="row">
      <label>Включить</label>
      <div class="switch"><input type="checkbox" id="lineTimerEnabled"><label class="slider" for="lineTimerEnabled"></label></div>
    </div>
    <div class="row">
      <label>Порог (мин)</label>
      <input type="number" id="lineTimerThreshold" min="1" max="60" value="1">
    </div>
    <div class="row">
      <label>Действие</label>
      <select id="lineAction">
        <option value="rejoin">Перевойти в очередь</option>
        <option value="relogin">Перелогиниться</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Таймер дозвона</div>
    <div class="row">
      <label>Включить</label>
      <div class="switch"><input type="checkbox" id="dialTimerEnabled"><label class="slider" for="dialTimerEnabled"></label></div>
    </div>
    <div class="row">
      <label>Порог (сек)</label>
      <input type="number" id="dialTimerThreshold" min="5" max="120" value="30">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Звук</div>
    <div class="row">
      <label>Тип</label>
      <select id="soundType">
        <option value="alarm">Сирена</option>
        <option value="beep">Бип</option>
        <option value="none">Без звука</option>
      </select>
    </div>
    <div class="row">
      <label>Громкость</label>
      <input type="number" id="volume" min="0" max="100" value="80" style="width:50px">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Перерыв</div>
    <div class="row">
      <label>Включить</label>
      <div class="switch"><input type="checkbox" id="breakEnabled"><label class="slider" for="breakEnabled"></label></div>
    </div>
    <div class="row">
      <label>Работа (мин)</label>
      <input type="number" id="breakWorkMinutes" min="10" max="180" value="60">
    </div>
    <div class="row">
      <label>Отдых (мин)</label>
      <input type="number" id="breakRestMinutes" min="1" max="30" value="10">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Telegram</div>
    <div class="row">
      <label>Bot Token</label>
      <input type="text" class="token" id="telegramBotToken" placeholder="123456:ABC-DEF...">
    </div>
    <div class="row">
      <label>Chat ID</label>
      <input type="text" class="chatid" id="telegramChatId" placeholder="123456789">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
